<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <!--Form Header-->
        <div class="container-head">
            <h2 class="header">Web Development Workshop</h2>
            <p class="header-p">Number of available seats: 23</p>
        </div>

        <div class="container-page">
            <!--Form Image-->
            <div class="container-img"><img src="webdevimage.png" alt=""></div>

            <!--Registration form-->
            <div class="container-form">
                <form>
                    <div class="form-user">
                        <span><i class="fa-solid fa-user"></i></span>
                        <input type="text" placeholder="Username" required>
                    </div>
                    <br>
                    <div class="form-email">
                        <span><i class="fa-solid fa-envelope"></i></span>                        
                        <input type="email" placeholder="Email" required>
                    </div>
                    <br>
                    <div class="form-tel">
                        <span><i class="fa-solid fa-phone"></i></span>                        
                        <input type="tel" placeholder="Phone No" required>
                    </div>
                    <br>
                    <div class="form-seat">
                        <span><i class="fa-solid fa-check-to-slot"></i></span>                        
                        <input type="number" placeholder="Choose no of seats">
                    </div>
                    <br>
                    <div class="form-secname">
                        <span><i class="fa-solid fa-user-plus"></i></span>                        
                        <input type="text" placeholder="Second username">
                    </div>
                    <br>
                    <button class="btn-sub">Submit</button>
                    <button class="btn-can">Cancel</button>

                </form>
            </div>
        </div>

    </div>    
</body>
</html>
